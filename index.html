<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Password Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="src/css/index.css" />

    <link rel="stylesheet" href="src/css/blocks/pass-gen/pass-gen.css" />
    <link rel="stylesheet" href="src/css/blocks/btn/btn.css" />
  </head>

  <body>
    <main>
      <h1 class="sr-only">Password Generator</h1>
      <section class="pass-gen" id="pass-gen">
        <header class="pass-gen__header">
          <h2 class="pass-gen__title">
            Generate a
            <div class="pass-gen__title-highlight">random password</div>
          </h2>
          <p class="pass-gen__body">Never use an insecure password again.</p>

          <form class="pass-gen__form" data-form>
            <button type="submit" class="btn">Generate passwords</button>
          </form>
        </header>
        <footer class="pass-gen__output">
          <ul class="pass-gen__list" data-passwords>
            <li class="pass-gen__password">>nfJjy!dDvR&ial</li>
            <li class="pass-gen__password">egxxWij@veiPUwK</li>
          </ul>
        </footer>
      </section>
    </main>

    <script src="src/js/index.js" type="module"></script>
  </body>
</html>
